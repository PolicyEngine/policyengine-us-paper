name: Paper

# Proves the manuscript renders from a clean environment. HTML only in CI —
# PDF/TeX requires a full TeX Live install, which is slower and flakier than
# this repository needs for a render-only check; render PDF locally with
# `quarto render paper/index.qmd` before submission.
on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "_quarto.yml"
      - ".github/workflows/paper.yml"
  pull_request:
    branches: [main]
    paths:
      - "paper/**"
      - "_quarto.yml"
      - ".github/workflows/paper.yml"

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render paper (HTML only)
        run: quarto render paper/index.qmd --to html
      - name: Check for unresolved TODO markers
        # Informational only: this outline stage is expected to have TODOs.
        # Fails the build only if a section file is entirely missing, not on
        # TODO count -- see README for what "v1 submission-ready" requires.
        run: |
          echo "TODO markers found (expected at outline stage):"
          grep -rn '\\todo{' paper/sections/ | wc -l
